<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>trabalhos | Isa Arnass</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    cursor:none;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#0A100D;
    color:white;
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
}

/* NAV */
nav{
    padding:30px 8%;
    display:flex;
    color:#F5F3EE;
    text-decoration:none;
    justify-content:space-between;
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
    font-weight:100;
    letter-spacing:2px;s
}

nav a{
    
    padding:30px 8%;
    display:flex;
    color:#F5F3EE;
    text-decoration:none;
    justify-content:space-between;
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
    font-weight:100;
    letter-spacing:2px;
}

/* HERO */

.hero{
    height:80vh;
    background:url("h.jpg") center center/cover;
    display:flex;
    align-items:center;
    padding:0 8%;
    position:relative;
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
}

.hero h1{
    position:relative;
    z-index:2;

    font-size:clamp(4rem,10vw,7rem);
    font-weight:300;
    letter-spacing:4px;
}

/* PROJETOS */

.project{
    padding:100px 8%;
    border-bottom:1px solid rgba(255,255,255,.08);

    opacity:0;
    transition:opacity 2s ease;
}

.project.show{
    opacity:1;
}

.project h2{
    font-size:2rem;
    font-weight:300;
    margin-bottom:30px;
    letter-spacing:2px;
}

.image-wrapper{
    overflow:hidden;
    border-radius:12px;
}

.project img{
    width:100%;
    display:block;
    border-radius:12px;
}

/* RESPONSIVO */

@media(max-width:900px){

.hero{
    height:60vh;
}

.hero h1{
    font-size:4rem;
}

.project{
    padding:60px 6%;
}

.project h2{
    font-size:1.5rem;
}

}
.links{
display:flex;
justify-content:center;
gap:24px;
}

.links a{
color:white;
text-decoration:none;
font-size:.72rem;
letter-spacing:4px;
text-transform:uppercase;
opacity:.85;
transition:.3s;
}

.links a:hover{
opacity:1;
}

.scroll{
margin-top:35px;
font-size:.65rem;
letter-spacing:4px;
opacity:.6;
}

/* Cursor personalizado */

.cursor{
position:fixed;
width:12px;
height:12px;
border-radius:50%;
background:white;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:9999;
transition:
width .2s,
height .2s,
opacity .2s;
}

.cursor.hover{
width:22px;
height:22px;
background:transparent;
border:1px solid white;
}

</style>
</head>
<body>



<nav>
<a href="index.html">ISA ARNASS</a>
<a href="index.html">home</a>
</nav>

<section class="hero">
    <h1>Trabalhos</h1>
</section>

<div class="project">
    <h2>Projeto 01</h2>

    <div class="image-wrapper">
        <img src="a.jpg" alt="Projeto 01">
    </div>
</div>

<div class="project">
    <h2>Projeto 02</h2>

    <div class="image-wrapper">
        <img src="s.jpg" alt="Projeto 02">
    </div>
</div>

<div class="project">
    <h2>Projeto 03</h2>

    <div class="image-wrapper">
        <img src="d.jpg" alt="Projeto 03">
    </div>
</div>
<div class="cursor"></div>
<script>

const projects = document.querySelectorAll('.project');

const observer = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting){

            entry.target.classList.add('show');

        }

    });

},{
    threshold:0.15
});

projects.forEach(project=>{
    observer.observe(project);
});



const slides = document.querySelectorAll('.slide');

let current = 0;
let scrolling = false;

window.addEventListener('wheel', (e) => {

    if (scrolling) return;

    scrolling = true;

    slides[current].classList.remove('active');

    if (e.deltaY > 0) {

        current++;

        if (current >= slides.length) {
            current = 0;
        }

    } else {

        current--;

        if (current < 0) {
            current = slides.length - 1;
        }

    }

    slides[current].classList.add('active');

    setTimeout(() => {
        scrolling = false;
    }, 800);

});

/* Cursor */

const cursor = document.querySelector('.cursor');

document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

document.querySelectorAll('a').forEach(link => {

    link.addEventListener('mouseenter', () => {
        cursor.classList.add('hover');
    });

    link.addEventListener('mouseleave', () => {
        cursor.classList.remove('hover');
    });

});

</script>

</body>
</html>
