<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>isa arnas </title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
cursor:none;
}

body{
overflow:hidden;
background:#000;
height:100vh;
}

.slide{
    position:fixed;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
}

.slide::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.45);
}

.slide.active{
opacity:1;
}

.menu{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:100;
text-align:center;
color:white;
}

.menu h1{
font-size:clamp(3.5rem,9vw,7rem);
letter-spacing:12px;
margin-bottom:20px;
font-weight:300;
}

.links{
display:flex;
justify-content:center;
gap:24px;
}

.links a{
color:white;
text-decoration:none;
font-size:.72rem;
letter-spacing:4px;
text-transform:uppercase;
opacity:.85;
transition:.3s;
}

.links a:hover{
opacity:1;
}

.scroll{
margin-top:35px;
font-size:.65rem;
letter-spacing:4px;
opacity:.6;
}

/* Cursor personalizado */

.cursor{
position:fixed;
width:12px;
height:12px;
border-radius:50%;
background:white;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:9999;
transition:
width .2s,
height .2s,
opacity .2s;
}

.cursor.hover{
width:22px;
height:22px;
background:transparent;
border:1px solid white;
}

</style>
</head>

<body>

<div class="slide active"
style="background-image:url('a.jpg')"></div>

<div class="slide"
style="background-image:url('d.jpg')"></div>

<div class="slide"
style="background-image:url('f.jpg')"></div>

<div class="slide"
style="background-image:url('g.jpg')"></div>

<div class="menu">

<h1>ISA ARNAS</h1>

<div class="links">
<a href="index.html">Home</a>
<a href="still.html">Still</a>
<a href="works.html">Works</a>
<a href="about.html">Sobre</a>
</div>

<div class="scroll">
SCROLL ↓
</div>

</div>
<div class="cursor"></div>
<script>

const slides = document.querySelectorAll('.slide');

let current = 0;
let scrolling = false;

window.addEventListener('wheel', (e) => {

    if (scrolling) return;

    scrolling = true;

    slides[current].classList.remove('active');

    if (e.deltaY > 0) {

        current++;

        if (current >= slides.length) {
            current = 0;
        }

    } else {

        current--;

        if (current < 0) {
            current = slides.length - 1;
        }

    }

    slides[current].classList.add('active');

    setTimeout(() => {
        scrolling = false;
    }, 800);

});

/* Cursor */

const cursor = document.querySelector('.cursor');

document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

document.querySelectorAll('a').forEach(link => {

    link.addEventListener('mouseenter', () => {
        cursor.classList.add('hover');
    });

    link.addEventListener('mouseleave', () => {
        cursor.classList.remove('hover');
    });

});

</script>

</body>
</html>
