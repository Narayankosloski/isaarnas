<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>isa arnas </title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
cursor:none;
}

body{
overflow:hidden;
background:#000;
height:100vh;
}

.slide{
    position:fixed;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
}

.slide::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.45);
}

.slide.active{
opacity:1;
}

.menu{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:100;
text-align:center;
color:white;
}

.menu h1{
font-size:clamp(3.5rem,9vw,7rem);
letter-spacing:12px;
margin-bottom:20px;
font-weight:300;
}

.links{
display:flex;
justify-content:center;
gap:24px;
}

.links a{
color:white;
text-decoration:none;
font-size:.72rem;
letter-spacing:4px;
text-transform:uppercase;
opacity:.85;
transition:.3s;
}

.links a:hover{
opacity:1;
}

.scroll{
margin-top:35px;
font-size:.65rem;
letter-spacing:4px;
opacity:.6;
}

/* Cursor personalizado */

.cursor{
position:fixed;
width:12px;
height:12px;
border-radius:50%;
background:white;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:9999;
transition:
width .2s,
height .2s,
opacity .2s;
}

.cursor.hover{
width:22px;
height:22px;
background:transparent;
border:1px solid white;
}
/* NAV */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    padding:30px 8%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.15);
    backdrop-filter:blur(15px);
}

nav a,
.dropbtn{
    color:#F5F3EE;
    text-decoration:none;
    font-size:.85rem;
    letter-spacing:4px;
    text-transform:uppercase;

    background:none;
    border:none;

    cursor:none;

    transition:.3s;
}

nav a:hover,
.dropbtn:hover{
    opacity:.7;
}

/* DROPDOWN */

.dropdown{
    position:relative;
}

.dropdown-content{
    position:absolute;
    top:140%;
    right:0;

    min-width:220px;

    background:rgba(10,16,13,.95);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;

    opacity:0;
    visibility:hidden;

    transform:translateY(10px);

    transition:.35s ease;
}

.dropdown-content a{
    display:block;
    padding:16px 20px;
}

.dropdown-content a:hover{
    background:rgba(255,255,255,.04);
}

.dropdown.active .dropdown-content{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}
</style>
</head>

<body>

<nav>

    <a href="home.html">ISA ARNASS</a>

    <div class="dropdown">

        <button class="dropbtn">
            PORTFOLIO +
        </button>

        <div class="dropdown-content">

            <a href="still.html">Still Photography</a>

            <a href="cinema.html">
                Direção de Fotografia
            </a>

            <a href="about.html">
                Sobre
            </a>

        </div>

    </div>

</nav>
<div class="slide active"
style="background-image:url('a.jpg')"></div>

<div class="slide"
style="background-image:url('d.jpg')"></div>

<div class="slide"
style="background-image:url('f.jpg')"></div>

<div class="slide"
style="background-image:url('g.jpg')"></div>

<div class="menu">

<h1>ISA ARNAS</h1>

<div class="links">
<a href="index.html">Home</a>
<a href="still.html">Still</a>
<a href="works.html">Works</a>
<a href="about.html">Sobre</a>
</div>

<div class="scroll">
SCROLL ↓
</div>

</div>
<div class="cursor"></div>
<script>

const slides = document.querySelectorAll('.slide');

let current = 0;
let scrolling = false;

window.addEventListener('wheel', (e) => {

    if (scrolling) return;

    scrolling = true;

    slides[current].classList.remove('active');

    if (e.deltaY > 0) {

        current++;

        if (current >= slides.length) {
            current = 0;
        }

    } else {

        current--;

        if (current < 0) {
            current = slides.length - 1;
        }

    }

    slides[current].classList.add('active');

    setTimeout(() => {
        scrolling = false;
    }, 800);

});

/* Cursor */

const cursor = document.querySelector('.cursor');

document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

document.querySelectorAll('a').forEach(link => {

    link.addEventListener('mouseenter', () => {
        cursor.classList.add('hover');
    });

    link.addEventListener('mouseleave', () => {
        cursor.classList.remove('hover');
    });

});

const dropdown = document.querySelector('.dropdown');
const button = document.querySelector('.dropbtn');

button.addEventListener('click', (e)=>{

    e.stopPropagation();

    dropdown.classList.toggle('active');

});

document.addEventListener('click', ()=>{

    dropdown.classList.remove('active');

});

</script>

</body>
</html>
