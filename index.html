<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
overflow:hidden;
background:#000;
height:100vh;
}

.slide{
position:fixed;
inset:0;
background-size:cover;
background-position:center;
opacity:0;
transition:1s;
}

.slide.active{
opacity:1;
}

.menu{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:100;
text-align:center;
color:white;
}

.menu h1{
font-size:clamp(4rem,10vw,8rem);
letter-spacing:10px;
margin-bottom:20px;
}

.links{
display:flex;
justify-content:center;
gap:30px;
}

.links a{
color:white;
text-decoration:none;
font-size:.9rem;
letter-spacing:3px;
text-transform:uppercase;
}

.scroll{
margin-top:40px;
font-size:.8rem;
letter-spacing:2px;
opacity:.7;
}

</style>
</head>

<body>

<div class="slide active"
style="background-image:url('a.jpg')"></div>

<div class="slide"
style="background-image:url('d.jpg')"></div>

<div class="slide"
style="background-image:url('f.jpg')"></div>

<div class="slide"
style="background-image:url('g.jpg')"></div>

<div class="links">

<a href="sobre.html">Sobre</a>
</div>

<div class="scroll">
SCROLL ↓
</div>

</div>

<script>

const slides = document.querySelectorAll('.slide');

let current = 0;
let scrolling = false;

window.addEventListener('wheel', (e) => {

    if (scrolling) return;

    scrolling = true;

    slides[current].classList.remove('active');

    if (e.deltaY > 0) {

        current++;

        if (current >= slides.length) {
            current = 0; // volta para a primeira
        }

    } else {

        current--;

        if (current < 0) {
            current = slides.length - 1; // vai para a última
        }

    }

    slides[current].classList.add('active');

    setTimeout(() => {
        scrolling = false;
    }, 800);

});

</script>

</body>
</html>
