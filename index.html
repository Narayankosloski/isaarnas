<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>isa arnas </title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
cursor:none;
}

body{
overflow:hidden;
background:#000;
height:100vh;
}

.slide{
    position:fixed;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
}

.slide::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.45);
}

.slide.active{
opacity:1;
}

.menu{
position:fixed;	
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:100;
text-align:center;
color:white;
}

.menu h1{
font-size:clamp(3.5rem,9vw,7rem);
letter-spacing:12px;
margin-bottom:20px;
font-weight:300;
}

.links{
    display:flex;
    justify-content:center;
    gap:24px;
}

.links a{
    color:white;
    text-decoration:none;
    font-size:.72rem;
    letter-spacing:4px;
    text-transform:uppercase;

    opacity:.8;

    transition:
        transform .4s ease,
        opacity .4s ease;
}

/* todos diminuem */

.links:hover a{
    opacity:.25;
}

/* o selecionado cresce */

.links a:hover{
    opacity:1 !important;
    transform:scale(1.15);
}
.scroll{
margin-top:35px;
font-size:.65rem;
letter-spacing:4px;
opacity:.6;
}

/* Cursor personalizado */

.cursor{
position:fixed;
width:12px;
height:12px;
border-radius:50%;
background:white;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:9999;
transition:
width .2s,
height .2s,
opacity .2s;
}

.cursor.hover{
width:22px;
height:22px;
background:transparent;
border:1px solid white;
}
/* NAV */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    padding:50px 8%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    
}

nav a,
.dropbtn{
    color:#F5F3EE;
    text-decoration:none;
    font-size:.85rem;
    letter-spacing:4px;
    text-transform:uppercase;

    background:none;
    border:none;

    cursor:none;

    transition:.3s;
}

nav a:hover,
.dropbtn:hover{
    opacity:.7;
}

/* DROPDOWN */

.menu-overlay{
    position:fixed;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    background:rgba(0,0,0,.92);
    backdrop-filter:blur(20px);

    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    visibility:hidden;

    transition:.5s ease;
}

.menu-overlay.active{
    opacity:1;
    visibility:visible;
}

.menu-button{
    background:none;
    border:none;
    padding:0;

    color:#F5F3EE;

    font-size:.85rem;
    letter-spacing:4px;
    text-transform:uppercase;

    cursor:none;

    transition:.3s;
}

.menu-button:hover{
    opacity:.7;
}


.overlay-links{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
}
.overlay-links a{
    font-size:3rem;
    letter-spacing:6px;
    text-transform:uppercase;
    font-weight:300;

    opacity:0;
    transform:translateY(30px);

    transition:
        opacity .5s ease,
        transform .5s ease;
}

/* Quando abrir */

.menu-overlay.active .overlay-links a{
    opacity:.8;
    transform:translateY(0);
}

/* Delay de cada item */

.menu-overlay.active .overlay-links a:nth-child(1){
    transition-delay:.1s;
}

.menu-overlay.active .overlay-links a:nth-child(2){
    transition-delay:.2s;
}

.menu-overlay.active .overlay-links a:nth-child(3){
    transition-delay:.3s;
}

.menu-overlay.active .overlay-links a:nth-child(4){
    transition-delay:.4s;
}

.overlay-links a:hover{
    opacity:1 !important;
    transform:scale(1.08);
}
.current{
    opacity:.25 !important;
    pointer-events:none;
}
</style>
</head>

<body>

<nav>

    <a href="index.html">ISA ARNASS</a>
    
    <div class="dropdown">

        <button class="menu-button">
            |||
        </button>


            <div class="menu-overlay">

                <div class="overlay-links">

                    <a href="home.html" class="current">
                        HOME
                    </a>

                    <a href="still.html">
                        STILLS
                    </a>

                    <a href="works.html">
                        WORKS
                    </a>

                    <a href="about.html">
                        ABOUT
                    </a>

                </div>

            </div>


        </div>

    </div>

</nav>
<div class="slide active"
style="background-image:url('a.jpg')"></div>

<div class="slide"
style="background-image:url('d.jpg')"></div>

<div class="slide"
style="background-image:url('f.jpg')"></div>

<div class="slide"
style="background-image:url('g.jpg')"></div>

<div class="menu">

    <h1>ISA ARNAS</h1>

<div class="links">
<a href="index.html">Home</a>
<a href="still.html">Still</a>
<a href="works.html">Works</a>
<a href="about.html">Sobre</a>
</div>

<div class="scroll">
SCROLL ↓
</div>

</div>
<div class="cursor"></div>
<script>

const slides = document.querySelectorAll('.slide');

let current = 0;
let scrolling = false;

window.addEventListener('wheel', (e) => {

    if (scrolling) return;

    scrolling = true;

    slides[current].classList.remove('active');

    if (e.deltaY > 0) {

        current++;

        if (current >= slides.length) {
            current = 0;
        }

    } else {

        current--;

        if (current < 0) {
            current = slides.length - 1;
        }

    }

    slides[current].classList.add('active');

    setTimeout(() => {
        scrolling = false;
    }, 800);

});

/* Cursor */

const cursor = document.querySelector('.cursor');

document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

document.querySelectorAll('a').forEach(link => {

    link.addEventListener('mouseenter', () => {
        cursor.classList.add('hover');
    });

    link.addEventListener('mouseleave', () => {
        cursor.classList.remove('hover');
    });

});



const menuButton =
document.querySelector('.menu-button');

const overlay =
document.querySelector('.menu-overlay');

menuButton.addEventListener('click',()=>{

    overlay.classList.toggle('active');

});

overlay.addEventListener('click',(e)=>{

    if(e.target === overlay){

        overlay.classList.remove('active');

    }

});

</script>

</body>
</html>
