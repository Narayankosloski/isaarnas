<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Still Photography | Isa Arnass</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#0A100D;
font-family:Inter,sans-serif;
color:white;
}

nav{
padding:30px 8%;
display:flex;
justify-content:space-between;
border-bottom:1px solid rgba(255,255,255,.08);
font-size:2rem;
font-family:"Cormorant Garamond",serif;
font-weight:100;
}

a{
color:white;
text-decoration:none;
}

.hero{
padding:50px 8% 60px;
}

.hero h1{
font-size:6rem;
font-family:"Cormorant Garamond",serif;
font-weight:300;
}

/* PROJETOS */

.project{
    padding:100px 8%;
    border-bottom:1px solid rgba(255,255,255,.08);

    opacity:0;
    transition:opacity 2s ease;
}

.project.show{
    opacity:1;
}

.project h2{
    font-size:2rem;
    font-weight:300;
    margin-bottom:30px;
    letter-spacing:2px;
}

.image-wrapper{
    overflow:hidden;
    border-radius:12px;
}

.project img{
    width:100%;
    display:block;
    border-radius:12px;
}

/* RESPONSIVO */

@media(max-width:900px){

.hero{
    height:60vh;
}

.hero h1{
    font-size:4rem;
}

.project{
    padding:60px 6%;
}

.project h2{
    font-size:1.5rem;
}

}


</style>
</head>
<body>

<nav>
<a href="index.html">ISA ARNASS</a>
<a href="index.html">home</a>
<a href="about.html">About</a>
</nav>

<section class="hero">
<h1>Still</h1>
</section>

<div class="gallery">

<div class="project"><img src="a.jpg"></div>
<div class="project"><img src="s.jpg"></div>
<div class="project"><img src="d.jpg"></div>
<div class="project"><img src="f.jpg"></div>
<div class="project"><img src="g.jpg"></div>
<div class="project"><img src="h.jpg"></div>

</div>
<script>

const projects = document.querySelectorAll('.project');

const observer = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting){

            entry.target.classList.add('show');

        }

    });

},{
    threshold:0.15
});

projects.forEach(project=>{
    observer.observe(project);
});

</script>
</body>
</html>
