<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About | Isa Arnass</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
cursor:none;
}

body{
margin:0;
background:#0A100D;
font-family:Inter,sans-serif;
color:white;
}

/* NAV */
nav{
    padding:30px 8%;
    display:flex;
    color:#F5F3EE;
    text-decoration:none;
    justify-content:space-between;
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
    font-weight:100;
    letter-spacing:2px;s
}

nav a{
    
    padding:30px 8%;
    display:flex;
    color:#F5F3EE;
    text-decoration:none;
    justify-content:space-between;
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
    font-weight:100;
    letter-spacing:2px;
}

a{
color:white;
text-decoration:none;
}

.hero{
padding:120px 8% 60px;
}

.hero h1{
font-size:6rem;
font-family:"Cormorant Garamond",serif;
font-weight:300;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
padding:0 8% 100px;
}

.photo{
height:700px;
overflow:hidden;
border-radius:12px;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

@media(max-width:900px){
.gallery{
grid-template-columns:1fr;
}
.photo{
height:450px;
}
}

.about{
display:grid;
grid-template-columns:1fr 1fr;
gap:80px;
padding:120px 8%;
}

.about img{
width:100%;
height:700px;
object-fit:cover;
border-radius:12px;
}

h1{
font-size:5rem;
}

p{
line-height:2;
font-size:1.1rem;
}

@media(max-width:900px){

.about{
grid-template-columns:1fr;
}

.about img{
height:450px;
}

}

.links{
display:flex;
justify-content:center;
gap:24px;
}

.links a{
color:white;
text-decoration:none;
font-size:.72rem;
letter-spacing:4px;
text-transform:uppercase;
opacity:.85;
transition:.3s;
}

.links a:hover{
opacity:1;
}

.scroll{
margin-top:35px;
font-size:.65rem;
letter-spacing:4px;
opacity:.6;
}

/* Cursor personalizado */

.cursor{
position:fixed;
width:12px;
height:12px;
border-radius:50%;
background:white;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:9999;
transition:
width .2s,
height .2s,
opacity .2s;
}

.cursor.hover{
width:22px;
height:22px;
background:transparent;
border:1px solid white;
}

</style>
</head>
<body>

<section class="hero">
<nav>
<a href="index.html">ISA ARNASS</a>
<a href="index.html">home</a>
</nav>
</section>
	
<div class="about">

<img src="e.jpg">

<div>

<section class="hero">
<h1>Isa Arnass</h1>
</section>
<p>
Fotógrafa, diretora de fotografia e artista visual.
</p>

<p>
Seu trabalho explora luz, atmosfera,
narrativa e memória através da imagem.
</p>

</div>

</div>

</section>
<div class="cursor"></div>
<script>
/* Cursor */

const cursor = document.querySelector('.cursor');

document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

document.querySelectorAll('a').forEach(link => {

    link.addEventListener('mouseenter', () => {
        cursor.classList.add('hover');
    });

    link.addEventListener('mouseleave', () => {
        cursor.classList.remove('hover');
    });

});

</script>
</body>
</html>
